[metadata]
name = legallink-fastapi
version = 0.1.0
description = LegalLink FastAPI service
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = LegalLink Team

[options]
packages = find:
include_package_data = True
python_requires = >=3.9

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,__pycache__,venv,env

[isort]
line_length = 100
profile = black
